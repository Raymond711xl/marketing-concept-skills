name: Validate skill package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate package structure
        run: python3 scripts/validate_package.py

      - name: Run raw evidence adapter smoke test
        run: python3 plugins/marketing-concept-skill/skills/insight-strategy/scripts/smoke_test_prepare_raw_evidence.py

      - name: Build downloadable release
        run: python3 scripts/build_release.py

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketing-concept-skills
          path: |
            dist/*.zip
            dist/*.sha256
